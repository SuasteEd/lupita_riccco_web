    <script>
      // Aplica la elección guardada antes del primer paint (sin flash).
      // Claro es el default siempre que no haya una elección explícita
      // guardada — no sigue prefers-color-scheme del sistema, para que la
      // marca se vea igual sin importar el modo del dispositivo del
      // visitante. El toggle manual (ThemeToggle.jsx) sigue funcionando
      // igual y su elección se respeta en visitas futuras.
      (function () {
        var stored = localStorage.getItem('lr-theme');
        var theme = stored === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
